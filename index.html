<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprietary Records</title>
    
    <style>
        @font-face {
            font-family: 'Ramsey';
            src: url('Ramsey SD.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Ramsey';
            src: url('Ramsey SD.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Ramsey', 'Helvetica Neue', sans-serif;
            text-align: center;
            padding: 80px 20px 60px;
            line-height: 1.6;
            margin: 0;
        }

        .main-title {
            font-size: 3.8em;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.3em;
            color: #444;
            margin-bottom: 80px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Container for all books */
        .books-container {
            max-width: 1200px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 80px 40px;
            padding: 0 20px;
        }

        /* Individual book card */
        .book-hub {
            max-width: 380px;
            margin: 0 auto;
        }

        .book-cover {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto 40px;
            box-shadow: 15px 20px 40px rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .book-cover:hover {
            transform: scale(1.03);
        }

        .book-title {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .book-subtitle {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
        }

        .download-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .download-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 68px;
            background: #f0f0f0;
            color: #000000;
            font-size: 1.25em;
            font-weight: 600;
            border-radius: 40px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .download-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .footer {
            margin-top: 120px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 160px;
            height: 60px;
            background: #f0f0f0;
            border-radius: 30px;
            transition: background 0.3s;
            margin: 0 auto;
        }

        .link-button:hover {
            background: #e0e0e0;
        }

        .link-button img {
            max-height: 32px;
            max-width: 130px;
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2.9em; }
            .books-container { grid-template-columns: 1fr; gap: 70px; }
            .book-cover { max-width: 260px; }
            .download-button { width: 190px; height: 62px; font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div class="main-title">Proprietary Records</div>
    <div class="subtitle">Publishing</div>

    <!-- MULTIPLE BOOKS GO HERE -->
    <div class="books-container">

        <!-- === BOOK 1 === -->
        <div class="book-hub">
            <img src="cover.jpg" alt="Revolution of Education" class="book-cover">
            <div class="book-title">Revolution of Education</div>
            <div class="book-subtitle">Baldur von Schirach</div>
            <div class="download-buttons">
                <a href="revolution-of-education.epub" class="download-button" download>
                    DOWNLOAD EPUB
                </a>
            </div>
        </div>

        <!-- === BOOK 2 === -->
        <div class="book-hub">
            <img src="book-cover.jpg" alt="Second Book Title" class="book-cover">
            <div class="book-title">Second Book Title</div>
            <div class="book-subtitle">Author Name</div>
            <div class="download-buttons">
                <a href="homes-of-the-hitler-youth.epub" class="download-button" download>
                    DOWNLOAD EPUB
                </a>
                <!-- Add PDF if you want -->
                <!-- <a href="second-book.pdf" class="download-button" download>DOWNLOAD PDF</a> -->
            </div>
        </div>

        <!-- === ADD MORE BOOKS BELOW (just copy-paste another block) === -->

    </div>

    <!-- X / Twitter button -->
    <div class="footer">
        <a href="https://x.com/skaldicwings" class="link-button" target="_blank" rel="noopener">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/X_%28formerly_Twitter%29_logo_late_2025.svg" alt="X">
        </a>
    </div>

</body>
</html>
