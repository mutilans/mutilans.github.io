<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proprietary Records</title>
    
    <!-- Ramsey font – upload your font files to the same folder as this HTML file -->
    <style>
        @font-face {
            font-family: 'Ramsey';
            src: url('Ramsey SD.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        
        @font-face {
            font-family: 'Ramsey';
            src: url('Ramsey SD.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        body {
            background: #ffffff;
            color: #000000;
            font-family: 'Ramsey', 'Helvetica Neue', sans-serif;
            text-align: center;
            padding: 80px 20px 60px;
            line-height: 1.6;
            margin: 0;
        }

        .main-title {
            font-size: 3.8em;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.3em;
            color: #444;
            margin-bottom: 80px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Book display – centered and simple */
        .book-hub {
            max-width: 520px;
            margin: 0 auto 100px;
        }

        .book-cover {
            width: 100%;
            max-width: 320px;
            height: auto;
            display: block;
            margin: 0 auto 40px;
            box-shadow: 15px 20px 40px rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .book-cover:hover {
            transform: scale(1.03);
        }

        .book-title {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .book-subtitle {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }

        .download-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .download-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 220px;
            height: 68px;
            background: #f0f0f0;
            color: #000000;
            font-size: 1.25em;
            font-weight: 600;
            border-radius: 40px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .download-button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* Twitter button at the very bottom – same style as your original */
        .footer {
            margin-top: 120px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 160px;
            height: 60px;
            background: #f0f0f0;
            border-radius: 30px;
            transition: background 0.3s;
            margin: 0 auto;
        }

        .link-button:hover {
            background: #e0e0e0;
        }

        .link-button img {
            max-height: 32px;
            max-width: 130px;
            width: auto;
            height: auto;
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2.9em; }
            .book-cover { max-width: 260px; }
            .download-button { width: 190px; height: 62px; font-size: 1.1em; }
        }
    </style>
</head>
<body>

    <div class="main-title">Proprietary Records</div>
    <div class="subtitle">Publishing</div>

    <!-- Your single book – centered and very simple -->
    <div class="book-hub">
        <!-- REPLACE THIS SRC WITH YOUR ACTUAL COVER FILE NAME (e.g. my-book-cover.jpg) -->
        <img src="book-cover.jpg" alt="Book Cover" class="book-cover">
        
        <!-- REPLACE THESE WITH YOUR ACTUAL BOOK TITLE AND SUBTITLE -->
        <div class="book-title">Homes of the Hitler Youth</div>
        <div class="book-subtitle">Erwin Skacel Publishing</div>
        
        <div class="download-buttons">
            <!-- REPLACE THIS HREF WITH YOUR ACTUAL EPUB FILE NAME -->
            <a href="Homes-of-the-Hitler-Youth.epub" class="download-button" download>
                DOWNLOAD EPUB
            </a>
            
            <!-- If you also have a PDF, uncomment and replace the href below -->
            <!--
            <a href="your-book.pdf" class="download-button" download>
                DOWNLOAD PDF
            </a>
            -->
        </div>
    </div>

    <!-- Twitter / X button at the bottom, exactly like your original style -->
    <div class="footer">
        <a href="https://x.com/skaldicwings" class="link-button" target="_blank" rel="noopener">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/X_%28formerly_Twitter%29_logo_late_2025.svg" alt="X">
        </a>
    </div>

</body>
</html>
